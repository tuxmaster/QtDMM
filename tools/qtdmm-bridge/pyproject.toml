[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "qtdmm-bridge"
version = "0.2.0"
description = "Serve multimeters to QtDMM over the network (RFC 2217)"
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
requires-python = ">=3.11"
dependencies = ["pyserial>=3.4"]

[project.optional-dependencies]
mdns = ["zeroconf>=0.38"]
authors = [{ name = "The QtDMM developers", email = "hello@qtdmm.de" }]
urls = { Homepage = "https://qtdmm.de", Source = "https://github.com/tuxmaster/QtDMM" }

[project.scripts]
qtdmm-bridge = "qtdmm_bridge:main"

[tool.setuptools]
py-modules = ["qtdmm_bridge"]
