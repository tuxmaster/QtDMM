# Decoder disagrees with the log here. Not asserted until confirmed on a real
# UT61E; then either fix the decoder (citing the log) and move the vectors
# back up, or move them to 'skipped' if the meter sides with the decoder.
pending:
  - finding: "Hz function (byte 6 low nibble 0x2): range table and unit prefix"
    evidence: >-
      The log's range table gives Hz ranges '0'=220.00, '1'=2200.0,
      '3'=22.000k, '4'=220.00k, '5'=2.2000M, '6'=22.000M, '7'=220.00M. The
      decoder (cyrustek_es51922.cpp, case 0x2) has (0,''),(2,'k'),(3,'k'),
      (1,'M'),(2,'M') for ranges 0-4 and nothing for 5-7 - every entry differs -
      and the line 'm_result.unit = duty ? "%" : "Hz"' right after the switch
      overwrites the prefixed unit formatResultValue() just built. Most Hz
      captures in the log are zero-valued and so cannot detect the scaling
      error; these five fail on the unit alone.
    vectors:
      - source_line: "0.000 kHz MANU"
        bytes: 33 30 30 30 30 30 32 30 30 30 30 30 0D 0A
        reading: {value: "0.000", unit: "kHz", range_mode: manual}
      - source_line: "0.00 kHz MANU"
        bytes: 34 30 30 30 30 30 32 30 30 30 30 30 0D 0A
        reading: {value: "0.00", unit: "kHz", range_mode: manual}
      - source_line: "0.0000 MHz MANU"
        bytes: 35 30 30 30 30 30 32 30 30 30 30 30 0D 0A
        reading: {value: "0.0000", unit: "MHz", range_mode: manual}
      - source_line: "0.000 MHz MANU"
        bytes: 36 30 30 30 30 30 32 30 30 30 30 30 0D 0A
        reading: {value: "0.000", unit: "MHz", range_mode: manual}
      - source_line: "0.00 MHz MANU"
        bytes: 37 30 30 30 30 30 32 30 30 30 30 30 0D 0A
        reading: {value: "0.00", unit: "MHz", range_mode: manual}
  - finding: "Hz sub-mode inside the V function (byte 10 bit 0)"
    evidence: >-
      The decoder keeps the V-range scaling and only relabels the unit. The
      log shows the display reading 50.0 Hz for digits 00500 at range '1'; the
      decoder yields 0.5. The log notes the Hz reading is independent of the
      V/mV range ('unabhängig ob V- oder mV-Bereich!'), i.e. it follows the Hz
      range table (range '1' = 2200.0, four digits before the point).
    vectors:
      - source_line: "DC    50.0 Hz AUTO"
        bytes: 31 30 30 35 30 30 3B 30 30 30 3B 30 0D 0A
        reading: {value: "50.0", unit: "Hz", coupling: DC, range_mode: auto}
  - finding: "Duty cycle (byte 7 bit 3): fixed 100.0 format"
    evidence: >-
      The range table's '%' column is '100.0*' for every range, i.e. four
      digits before the point regardless of the range code. The decoder applies
      the V-range (49.4 -> 0.0494) or Hz-range (16.3 -> 163000) scaling instead.
    vectors:
      - source_line: "DC    49.4 % MANU"
        bytes: 30 30 30 34 39 34 3B 38 30 30 39 30 0D 0A
        reading: {value: "49.4", unit: "%", coupling: DC, range_mode: manual}
      - source_line: "16.3 % MANU"
        bytes: 34 30 30 31 36 33 32 38 30 30 30 30 0D 0A
        reading: {value: "16.3", unit: "%", range_mode: manual}
  - finding: "Diode function (0x1): unit"
    evidence: >-
      The decoder emits formatResultValue(3,'m','V') -> 'mV'; the log line
      shows the diode display in V, with the overload point position '.0L'
      pointing at a 2.2000-style format (one digit before the point). Medium
      confidence - the diode range is not in the log's range table.
    vectors:
      - source_line: ".0L   V MANU Diode"
        bytes: 30 32 32 35 38 30 31 31 30 30 30 30 0D 0A
        reading: {value: ".0L", unit: "V", range_mode: manual, flags: [Diode]}
        remark: "Keine Bereichsumschaltung!"

skipped:
  - source_line: "AC    0.03 mA AUTO"
    bytes: 31 30 30 30 30 33 3F 30 30 30 34 30 0D 0A
    reason: >-
      label says AUTO but byte 10 is 0x34, i.e. the AUTO bit (bit 1) is clear;
      the neighbouring 'AC 0.007 mA AUTO' has 0x36 with the bit set. Internal
      inconsistency of the log, not a decoder question.
