protocol: CyrustekES51922
decoder: src/decoders/cyrustek_es51922.cpp
devices: [Uni-Trend UT61E, Wintex TD2200]
frames_per_reading: 1
unit_map:                      # log spelling -> what the decoder emits
  "µ": "u"
sources:
  - docs/protocols/sources/UT61E.log
  - hardware capture, Uni-Trend UT61E on /dev/ttyUSB0 (PL2303), 2026-09-18
  - hardware capture, Uni-Trend UT61E with signal generator, display read by
    Sarah, 2026-09-19 (verifies the frequency, duty and diode fixes live)

# 'reading' is what the log says the meter displayed; dval, unit, range and
# hold are derived from it. Put decoder-specific assertions (special, val)
# under 'expect' by hand. 'range_label' and 'remark' are informational.
vectors:
  - source_line: "DC  0.0000 V AUTO BG"
    bytes: 30 30 30 30 30 30 3B 30 30 30 3A 30 0D 0A
    reading: {value: "0.0000", unit: "V", coupling: DC, range_mode: auto, flags: [BG]}
