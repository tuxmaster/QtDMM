protocol: FlukeQM
decoder: src/decoders/fluke_qm.cpp
devices: [Fluke 87-IV, Fluke 89-IV, Fluke 187, Fluke 189, Fluke 287, Fluke 289]
frames_per_reading: 1
unit_map:                      # spec spelling -> what the decoder emits
  "u": "µ"
sources:
  - docs/protocols/sources/fluke_18x_remote.pdf
  - docs/protocols/sources/fluke_28x_remote.pdf

# Polled protocol: QtDMM sends "QM\r", the meter answers with a CMD_ACK line
# ("0\r") and one reading line. Frames are variable-length lines; the ones
# below that start with "30 0D" carry the ACK in front of the reading, as the
# reader hands them to the decoder. The 18x lines (87-IV/89-IV/187/189) are
# display strings, the 28x lines (287/289) are "value,UNIT,STATE,ATTRIBUTE"
# with the value in base units. The three 18x examples and all 17 28x examples
# are taken verbatim from the specifications; the remaining 18x lines are
# built from the unit list in the 18x specification and the libsigrok
# fluke-18x.c parser (no capture available).
vectors:
  - source_line: "QM,+47.66 KOhms"
    source: docs/protocols/sources/fluke_18x_remote.pdf
    bytes: 30 0D 51 4D 2C 2B 34 37 2E 36 36 20 4B 4F 68 6D 73 0D
    reading: {value: "47.66", unit: "kOhm", function: resistance}
    expect: {special: OH, val: "47.66"}
  - source_line: "QM,-121.43 VDC"
    source: docs/protocols/sources/fluke_18x_remote.pdf
    bytes: 30 0D 51 4D 2C 2D 31 32 31 2E 34 33 20 56 44 43 0D
    reading: {value: "-121.43", unit: "V", coupling: DC}
    expect: {special: DC, val: "-121.43"}
  - source_line: "QM,Out of Range mVDC"
