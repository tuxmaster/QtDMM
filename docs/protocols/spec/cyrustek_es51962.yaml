protocol: CyrustekES51962
decoder: src/decoders/cyrustek_es51962.cpp
devices: [PeakTech 3315, Uni-Trend UT70B]
frames_per_reading: 2
unit_map:                      # log spelling -> what the decoder emits
  "µ": "u"
  "°C": "C"
  "°F": "dF"
sources:
  - docs/protocols/sources/UT70B.log

# 'reading' is what the log says the meter displayed; dval, unit, range and
# hold are derived from it. Put decoder-specific assertions (special, val)
# under 'expect' by hand. 'range_label' and 'remark' are informational.
vectors:
  - source_line: "DC  005.8 mV AUTO 400mV"
    bytes: 30 30 30 35 38 3B 30 30 3A 0D 0A
    reading: {value: "005.8", unit: "mV", coupling: DC, range_mode: auto, range_label: "400mV"}
  - source_line: "DC -002.1 mV MAN 400mV"
    bytes: 30 30 30 32 31 3B 34 30 38 0D 0A
    reading: {value: "-002.1", unit: "mV", coupling: DC, range_mode: manual, range_label: "400mV"}
  - source_line: "DC -0.000 V MAN 4V"
    bytes: 31 30 30 30 30 3B 34 30 38 0D 0A
    reading: {value: "-0.000", unit: "V", coupling: DC, range_mode: manual, range_label: "4V"}
  - source_line: "DC  00.00 V MAN 40V"
    bytes: 32 30 30 30 30 3B 30 30 38 0D 0A
    reading: {value: "00.00", unit: "V", coupling: DC, range_mode: manual, range_label: "40V"}
  - source_line: "DC -000.0 V MAN 400V"
    bytes: 33 30 30 30 30 3B 34 30 38 0D 0A
    reading: {value: "-000.0", unit: "V", coupling: DC, range_mode: manual, range_label: "400V"}
  - source_line: "DC  000.0 V MAN 400V"
    bytes: 33 30 30 30 30 3B 30 30 38 0D 0A
    reading: {value: "000.0", unit: "V", coupling: DC, range_mode: manual, range_label: "400V"}
  - source_line: "DC  0000 V MAN 4000V"
    bytes: 34 30 30 30 30 3B 34 30 38 0D 0A
    reading: {value: "0000", unit: "V", coupling: DC, range_mode: manual, range_label: "4000V"}
  - source_line: "AC  040.1 mV AUTO 400mV"
    bytes: 30 30 34 30 31 3B 30 30 36 0D 0A
    reading: {value: "040.1", unit: "mV", coupling: AC, range_mode: auto, range_label: "400mV"}
  - source_line: "AC  039.7 mV MAN 400mV"
    bytes: 30 30 33 39 37 3B 30 30 34 0D 0A
    reading: {value: "039.7", unit: "mV", coupling: AC, range_mode: manual, range_label: "400mV"}
  - source_line: "0.L MOhm AUTO 40M"
    bytes: 35 34 30 30 30 33 31 30 32 0D 0A
    reading: {value: "0.L", unit: "MOhm", range_mode: auto, range_label: "40M"}
    remark: "Überlaufsignalisierung durch \"40 MOhm\", nicht \"0.L\" (wie im PC-Programm)"
  - source_line: "0.L MOhm MAN 40M"
    bytes: 35 34 30 30 30 33 31 30 30 0D 0A
    reading: {value: "0.L", unit: "MOhm", range_mode: manual, range_label: "40M"}
  - source_line: "00.00 MOhm MAN 40M"
    bytes: 35 30 30 30 30 33 30 30 30 0D 0A
    reading: {value: "00.00", unit: "MOhm", range_mode: manual, range_label: "40M"}
  - source_line: "014.0 Ohm MAN 400"
    bytes: 30 30 31 34 30 33 30 30 30 0D 0A
    reading: {value: "014.0", unit: "Ohm", range_mode: manual, range_label: "400"}
  - source_line: "0.014 kOhm MAN 4k"
    bytes: 31 30 30 31 34 33 30 30 30 0D 0A
    reading: {value: "0.014", unit: "kOhm", range_mode: manual, range_label: "4k"}
  - source_line: "000.0 kOhm MAN 400k"
    bytes: 33 30 30 30 30 33 30 30 30 0D 0A
    reading: {value: "000.0", unit: "kOhm", range_mode: manual, range_label: "400k"}
  - source_line: "0.000 MOhm MAN 4M"
    bytes: 34 30 30 30 30 33 30 30 30 0D 0A
    reading: {value: "0.000", unit: "MOhm", range_mode: manual, range_label: "4M"}
  - source_line: "0.146 nF AUTO 4nF"
    bytes: 30 30 31 34 36 36 30 30 32 0D 0A
    reading: {value: "0.146", unit: "nF", range_mode: auto, range_label: "4nF"}
  - source_line: "0.146 nF MAN 4nF"
    bytes: 30 30 31 34 36 36 30 30 30 0D 0A
    reading: {value: "0.146", unit: "nF", range_mode: manual, range_label: "4nF"}
  - source_line: "00.16 nF MAN 40nF"
    bytes: 31 30 30 31 36 36 30 30 30 0D 0A
    reading: {value: "00.16", unit: "nF", range_mode: manual, range_label: "40nF"}
  - source_line: "000.2 nF MAN 400nF"
    bytes: 32 30 30 30 32 36 30 30 30 0D 0A
    reading: {value: "000.2", unit: "nF", range_mode: manual, range_label: "400nF"}
  - source_line: "0.000 nF MAN 4µF"
    bytes: 33 30 30 30 30 36 30 30 30 0D 0A
    reading: {value: "0.000", unit: "µF", range_mode: manual, range_label: "4µF"}
    remark: "log's unit column reads nF, but its range column and range table say 4.000µF for this range code; unit taken from those"
  - source_line: "00.00 nF MAN 40µF"
    bytes: 34 30 30 30 30 36 30 30 30 0D 0A
    reading: {value: "00.00", unit: "µF", range_mode: manual, range_label: "40µF"}
    remark: "log's unit column reads nF, but its range column and range table say 40.00µF for this range code; unit taken from those"
  - source_line: "000.0 nF MAN 400µF"
    bytes: 35 30 30 30 30 36 30 30 30 0D 0A
    reading: {value: "000.0", unit: "µF", range_mode: manual, range_label: "400µF"}
    remark: "log's unit column reads nF, but its range column and range table say 400.0µF for this range code; unit taken from those"
  - source_line: "0.000 nF MAN 4mF"
    bytes: 36 30 30 30 30 36 30 30 30 0D 0A
    reading: {value: "0.000", unit: "mF", range_mode: manual, range_label: "4mF"}
    remark: "log's unit column reads nF, but its range column and range table say 4.000mF for this range code; unit taken from those"
    remark: "langes Messintervall, ca. 5 s"
  - source_line: "00.00 nF MAN 40mF"
    bytes: 37 30 30 30 30 36 30 30 30 0D 0A
    reading: {value: "00.00", unit: "mF", range_mode: manual, range_label: "40mF"}
    remark: "log's unit column reads nF, but its range column and range table say 40.00mF for this range code; unit taken from those"
  - source_line: "0.000 kHz AUTO 4k"
    bytes: 30 30 30 30 30 32 30 30 32 0D 0A
    reading: {value: "0.000", unit: "kHz", range_mode: auto, range_label: "4k"}
  - source_line: "0.000 kHz MAN 4k"
    bytes: 30 30 30 30 30 32 30 30 30 0D 0A
    reading: {value: "0.000", unit: "kHz", range_mode: manual, range_label: "4k"}
  - source_line: "0.00 kHz MAN 40k"
    bytes: 31 30 30 30 30 32 30 30 30 0D 0A
    reading: {value: "0.00", unit: "kHz", range_mode: manual, range_label: "40k"}
  - source_line: "0.0 kHz MAN 400k"
    bytes: 32 30 30 30 30 32 30 30 30 0D 0A
    reading: {value: "0.0", unit: "kHz", range_mode: manual, range_label: "400k"}
  - source_line: "0.000 MHz MAN 4M"
    bytes: 33 30 30 30 30 32 30 30 30 0D 0A
    reading: {value: "0.000", unit: "MHz", range_mode: manual, range_label: "4M"}
  - source_line: "0.00 MHz MAN 40M"
    bytes: 34 30 30 30 30 32 30 30 30 0D 0A
    reading: {value: "0.00", unit: "MHz", range_mode: manual, range_label: "40M"}
  - source_line: "0.0 MHz MAN 400M"
    bytes: 35 30 30 30 30 32 30 30 30 0D 0A
    reading: {value: "0.0", unit: "MHz", range_mode: manual, range_label: "400M"}
  - source_line: "0.00 kRPM AUTO 40k"
    bytes: 30 30 30 30 30 32 38 30 32 0D 0A
    reading: {value: "0.00", unit: "kRPM", range_mode: auto, range_label: "40k"}
    remark: "Umdrehungen pro Minute"
  - source_line: "0.0 MRPM MAN 400M"
    bytes: 34 30 30 30 30 32 38 30 30 0D 0A
    reading: {value: "0.0", unit: "MRPM", range_mode: manual, range_label: "400M"}
  - source_line: "20 °C FIX"
    bytes: 30 30 30 32 30 34 38 30 30 0D 0A
    reading: {value: "20", unit: "°C", range_mode: manual}
  - source_line: "68 °F FIX"
    bytes: 30 30 30 36 38 34 30 30 30 0D 0A
    reading: {value: "68", unit: "°F", range_mode: manual}
  - source_line: "DC   0.0 µA AUTO 400µA"
    bytes: 30 30 30 30 30 3D 30 30 3A 0D 0A
    reading: {value: "0.0", unit: "µA", coupling: DC, range_mode: auto, range_label: "400µA"}
  - source_line: "DC   0.0 µA MAN 400µA"
    bytes: 30 30 30 30 30 3D 30 30 38 0D 0A
    reading: {value: "0.0", unit: "µA", coupling: DC, range_mode: manual, range_label: "400µA"}
  - source_line: "DC    -0 µA MAN 4000µA"
    bytes: 31 30 30 30 30 3D 34 30 38 0D 0A
    reading: {value: "-0", unit: "µA", coupling: DC, range_mode: manual, range_label: "4000µA"}
  - source_line: "AC   0.0 µA AUTO 400µA"
    bytes: 30 30 30 30 30 3D 30 30 36 0D 0A
    reading: {value: "0.0", unit: "µA", coupling: AC, range_mode: auto, range_label: "400µA"}
  - source_line: "AC   0.0 µA MAN 400µA"
    bytes: 30 30 30 30 30 3D 30 30 34 0D 0A
    reading: {value: "0.0", unit: "µA", coupling: AC, range_mode: manual, range_label: "400µA"}
  - source_line: "AC     0 µA MAN 4000µA"
    bytes: 31 30 30 30 30 3D 30 30 34 0D 0A
    reading: {value: "0", unit: "µA", coupling: AC, range_mode: manual, range_label: "4000µA"}
  - source_line: "DC -0.00 mA AUTO 40mA"
    bytes: 30 30 30 30 30 39 34 30 3A 0D 0A
    reading: {value: "-0.00", unit: "mA", coupling: DC, range_mode: auto, range_label: "40mA"}
  - source_line: "AC   0.0 mA MAN 400mA"
    bytes: 31 30 30 30 30 39 30 30 34 0D 0A
    reading: {value: "0.0", unit: "mA", coupling: AC, range_mode: manual, range_label: "400mA"}
  - source_line: "DC  0.00 A FIX 40A"
    bytes: 30 30 30 30 30 3F 30 30 38 0D 0A
    reading: {value: "0.00", unit: "A", coupling: DC, range_mode: manual, range_label: "40A"}
  - source_line: "AC  0.00 A FIX 40A"
    bytes: 30 30 30 30 30 3F 30 30 34 0D 0A
    reading: {value: "0.00", unit: "A", coupling: AC, range_mode: manual, range_label: "40A"}

skipped:
  - source_line: "0.001 kOhm MAN 40k"
    bytes: 32 30 30 30 31 33 30 30 30 0D 0A
    reason: >-
      the 40.00 kOhm range has two decimals, so the digits 0001 read 00.01 kOhm
      (10 Ohm), which is what the decoder returns; the label's 0.001 (three
      decimals) belongs to the 4.000k format. Label inconsistent with its own
      range column.
  - source_line: "AC  033.8 mV dito+HOLD"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: "AC  040.3 mV dito+MAX"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: "AC  040.9 mV dito+DELTA"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: "0L. Pieps"
    reason: "no unit token found"
  - source_line: "014.0 Pieps"
    reason: "no unit token found"
  - source_line: ".0L V Diode"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: "0.026 V Diode"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: ""
    reason: "no unit token found"
