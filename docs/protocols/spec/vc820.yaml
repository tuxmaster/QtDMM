skipped:
  - source_line: "DC -004.5 mV AUTO"
    bytes: 17 27 3D 47 5D 60 75 8B 9E A0 B8 C0 D4 E8
    reason: >-
      the bytes are identical to the 'DC 001.5 mV AUTO' line: byte 1 is 0x27
      (sign bit clear) and digit 3 decodes to '1', so the frame encodes +001.5 mV.
      Copy-paste slip in the log; the decoder's +0.0015 is what the bytes say.
  - source_line: "AC TRMS 0.045 V AUTO"
    bytes: 1B 27 3D 4F 5D 62 77 83 9F A0 B0 C0 D4 E8
    reason: >-
      the log's own annotation above this line reads '0 .0 4 5?' - the author
      was unsure of the last digit. The segment pattern 0x3f is a '9', so the
      frame encodes 0.049 V. Label uncertain, not a decoder question.
  - source_line: "0.000 Hz"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: "0.000 Hz %"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: ".0L V Diode"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: "0L. V Ton"
    reason: "no range mode (AUTO/MANU/...) after the unit"
  - source_line: ".0L kOhm"
    reason: "no range mode (AUTO/MANU/...) after the unit"
