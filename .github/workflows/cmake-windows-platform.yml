name: Windows build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install Qt
      uses: jurplel/install-qt-action@v4
      with:
        version: '6.8.*'
        arch: win64_msvc2022_64
        modules: 'qtserialport qtcharts qtconnectivity'
        cache: true

    # Qt ships no fonts; the offscreen platform used by the widget tests
    # needs one, so put DejaVu where QFontDatabase looks (lib/fonts)
    - name: Install fonts for the widget tests
      shell: pwsh
      run: |
        $fonts = Join-Path $env:QT_ROOT_DIR "lib/fonts"
        New-Item -ItemType Directory -Force $fonts | Out-Null
        Invoke-WebRequest -Uri https://github.com/dejavu-fonts/dejavu-fonts/releases/download/version_2_37/dejavu-fonts-ttf-2.37.zip -OutFile dejavu.zip
        Expand-Archive dejavu.zip -DestinationPath dejavu
        Copy-Item dejavu/dejavu-fonts-ttf-2.37/ttf/DejaVuSans*.ttf $fonts
        Get-ChildItem $fonts

    - name: Set up MSVC environment
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: x64

    - name: Configure
      run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON

    - name: Build
      run: cmake --build build

    - name: Test
      run: ctest --test-dir build --output-on-failure

    # ZIP (portable) and Inno Setup installer from the same install tree;
    # cpack runs install + windeployqt + iscc (preinstalled on the runner).
    - name: Package
      run: cpack --config build/CPackConfig.cmake

    - name: Upload packages
      uses: actions/upload-artifact@v4
      with:
        name: QtDMM-windows-x64
        path: |
          packages/*.zip
          packages/*.exe
