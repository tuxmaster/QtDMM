name: Release

# A version tag (26.1-rc1, 26.1, 26.1.1 - see docs/dev/releasing.md) builds the
# Linux AppImage and the Windows installer + ZIP with the regular workflows and
# puts them into a DRAFT release. A maintainer reviews it and publishes it by
# hand; tags with a suffix (-rc1, -beta1) become pre-releases.
# When the release already exists (made on GitHub's release page, which also
# creates the tag), the files are added to it and the release is left as it is.
on:
  push:
    tags: [ '[0-9][0-9].[1-9]*' ]

permissions:
  contents: write

jobs:
  linux:
    uses: ./.github/workflows/cmake-ubuntu-platform.yml

  windows:
    uses: ./.github/workflows/cmake-windows-platform.yml

  draft:
    needs: [ linux, windows ]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/download-artifact@v4
      with:
        path: dist
        merge-multiple: true

    - name: Create the draft release, or add the files to an existing one
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        mv dist/QtDMM.AppImage "dist/QtDMM-${TAG}-x86_64.AppImage"
        ls -l dist
        if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release upload "$TAG" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          case "$TAG" in *-*)
            [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isPrerelease --jq .isPrerelease)" = true ] \
              || echo "::warning::$TAG has a suffix but the release is not marked as a pre-release" ;;
          esac
        else
          pre=""
          case "$TAG" in *-*) pre="--prerelease" ;; esac
          gh release create "$TAG" dist/* \
            --repo "$GITHUB_REPOSITORY" --verify-tag --draft $pre \
            --title "QtDMM $TAG" \
            --notes "Draft created from tag $TAG. The changes are in CHANGELOG; the handbook is at https://qtdmm.de/docs/."
        fi
