name: Ubuntu test build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]
  workflow_call:   # from release.yml for a version tag

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0   # tags and history: the version comes from git describe
 
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install -y \
          qt6-base-dev \
          qt6-tools-dev \
          qt6-tools-dev-tools \
          qt6-serialport-dev \
          qt6-connectivity-dev \
          qt6-charts-dev \
          qt6-svg-dev \
          libhidapi-dev \
          libhidapi-hidraw0 \
          cmake \
          build-essential \
          zsync \
          libxkbcommon-x11-dev

    - name: Configure and Build
      working-directory: ${{github.workspace}}/
      run: ./compile.sh appimage

    - name: Test
      working-directory: ${{github.workspace}}/
      run: ./compile.sh ctest

    - name: Upload AppImage artifact
      if: github.event_name != 'pull_request'
      uses: actions/upload-artifact@v4
      with:
        name: QtDMM-linux-AppImage
        path: ${{ github.workspace }}/packages/QtDMM.AppImage
